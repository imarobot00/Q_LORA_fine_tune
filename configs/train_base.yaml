# Training hyperparameters — STARTING ranges (plan §3.4). Tune on VAL loss.
# With ~500 train samples and effective batch 16, 1 epoch ~= 31 steps.
experiment_id: E0
learning_rate: 2.0e-4
num_train_epochs: 2
per_device_train_batch_size: 4
gradient_accumulation_steps: 4      # effective batch = 4 * 4 = 16
warmup_ratio: 0.05
weight_decay: 0.01
lr_scheduler_type: cosine
optim: adamw_8bit
seed: 3407
logging_steps: 1
eval_strategy: steps
eval_steps: 5
save_strategy: steps
save_steps: 5
load_best_model_at_end: true
metric_for_best_model: eval_loss
greater_is_better: false
output_dir: results/experiments/E0
